[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
script = 'script'
test = 'test'
cache_path = 'cache_forge'
solc = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "osaka"
bytecode_hash = "none"
cbor_metadata = false
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "solady/=lib/solady/src/",
    "openzeppelin/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@automata-network/on-chain-pccs/=lib/automata-on-chain-pccs/src/",
    "@automata-network/dcap-attestation/=lib/automata-dcap-attestation/evm/contracts/",
    "risc0/=stubs/risc0/",
    "@sp1-contracts/=stubs/sp1/",
]

[rpc_endpoints]
xlayer_testnet = "https://testrpc.xlayer.tech"
xlayer = "https://rpc.xlayer.tech"
local = "http://127.0.0.1:8545"
